  :root {
    --u-color:#D11A2A; --u-color-2:#E8455A;
    --t-color:#7C808C; --t-color-2:#A7ABB6;
    --grad:linear-gradient(135deg,#E01E2B,#6E0F16);
    --ink:#ECECEF; --ink-soft:#8E8A96;
    --glass:rgba(28,26,32,0.55); --glass-strong:rgba(42,38,48,0.74);
    --hair:rgba(255,255,255,0.14); --shadow:0 14px 40px rgba(0,0,0,0.5);
    --field-bg:rgba(255,255,255,0.06); --chip-bg:rgba(255,255,255,0.09);
    --bg-grad:linear-gradient(165deg,#0B0B0D 0%,#141017 55%,#0A0A0C 100%);
    --blob1:#3A0E16; --blob2:#201826; --blob3:#120A10;
    --num:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { background:#0B0B0D; }
  body { background:var(--bg-grad); background-attachment:fixed; min-height:100vh; transition:background .6s ease; }

  .app { position:relative; z-index:1; min-height:100vh; max-width:460px; margin:0 auto; padding:24px 18px 140px; overflow:hidden; color:var(--ink); }

  .bg { position:fixed; inset:0; z-index:0; background:var(--bg-grad); transition:background .6s ease; }
  .blob { position:fixed; z-index:0; border-radius:50%; filter:blur(58px); opacity:.6; will-change:transform; transition:background .6s ease; }
  .blob.b1 { width:340px; height:340px; background:radial-gradient(circle,var(--blob1),transparent 70%); top:-70px; left:-80px; animation:drift1 19s ease-in-out infinite; }
  .blob.b2 { width:300px; height:300px; background:radial-gradient(circle,var(--blob2),transparent 70%); top:240px; right:-90px; animation:drift2 23s ease-in-out infinite; }
  .blob.b3 { width:360px; height:360px; background:radial-gradient(circle,var(--blob3),transparent 70%); bottom:-130px; left:-50px; animation:drift3 26s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(55px,45px) scale(1.14)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-45px,60px) scale(1.1)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(45px,-35px) scale(1.12)} }

  #vig { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:1; transition:opacity .6s;
    background:radial-gradient(125% 85% at 50% 0%, transparent 42%, rgba(0,0,0,.55) 100%); }
  #fx { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #fx .sp { position:absolute; opacity:0; animation:tw 3.6s ease-in-out infinite; filter:drop-shadow(0 0 5px rgba(255,170,225,.85)); }
  @keyframes tw { 0%,100%{opacity:0; transform:scale(.4) rotate(0)} 50%{opacity:.95; transform:scale(1.15) rotate(18deg)} }

  .glass { background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(150%); backdrop-filter:blur(24px) saturate(150%);
    border:1px solid var(--hair); border-radius:26px; box-shadow:var(--shadow), inset 0 1px 1px rgba(255,255,255,.14); position:relative; }
  .glass::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 42%); opacity:.9; }

  /* ===== PIN 鎖 ===== */
  .pin-gate { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg-grad); transition:opacity .5s; }
  .pin-gate.hide { opacity:0; pointer-events:none; }
  .pin-card { width:100%; max-width:322px; padding:32px 26px 28px; text-align:center; }
  .pin-emblem { display:flex; justify-content:center; margin-bottom:8px; }
  .pin-emblem svg { animation:bob 4s ease-in-out infinite; }
  .pin-card h2 { font-size:19px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .pin-card p { font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
  .pin-dots { display:flex; justify-content:center; gap:15px; margin-bottom:26px; }
  .pin-dots span { width:14px; height:14px; border-radius:50%; background:var(--field-bg); border:1.5px solid var(--hair); transition:all .2s; }
  .pin-dots span.on { background:var(--u-color); border-color:var(--u-color); transform:scale(1.15); }
  .pin-gate.err .pin-dots { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
  .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .pin-key { height:58px; border:none; border-radius:18px; font-family:var(--num); font-size:26px; font-weight:600; color:var(--ink); cursor:pointer;
    background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid var(--hair); transition:transform .1s; }
  .pin-key:active { transform:scale(.9); }
  .pin-key.fn { font-family:inherit; font-size:15px; background:transparent; border:none; color:var(--ink-soft); }
  .pin-key.blank { visibility:hidden; }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; letter-spacing:.4px; color:var(--ink); }
  .brand .dot { width:26px; height:26px; border-radius:9px; background:var(--grad); box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .datepill { display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:13px; font-weight:500; color:var(--ink-soft); border-radius:20px; }
  .sync { width:7px; height:7px; border-radius:50%; background:#C9A227; transition:background .3s; box-shadow:0 0 6px currentColor; }
  .sync.ok { background:#5FBE7A; }

  .viewer { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
  .vlab { font-size:12px; color:var(--ink-soft); font-weight:600; }
  .vbtn { padding:7px 16px; border-radius:14px; border:1.5px solid transparent; background:var(--glass); color:var(--ink-soft);
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); transition:all .25s; }
  .vbtn.on { background:var(--glass-strong); color:var(--ink); border-color:var(--u-color); }
  .palettes { display:flex; gap:9px; overflow-x:auto; padding:2px; margin:0 0 8px; }
  .palettes::-webkit-scrollbar { display:none; }
  .pal-btn { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:9px 12px 9px 10px; cursor:pointer;
    border-radius:16px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--glass); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border:1.5px solid transparent; transition:all .25s; white-space:nowrap; }
  .pal-btn .sw { width:24px; height:15px; border-radius:6px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
  .pal-btn .owner { font-size:9.5px; padding:2px 6px; border-radius:7px; background:var(--chip-bg); color:var(--ink-soft); }
  .pal-btn.on { color:var(--ink); border-color:var(--u-color); background:var(--glass-strong); }
  .theme-cap { font-size:11.5px; color:var(--ink-soft); margin:2px 4px 18px; line-height:1.5; }

  .hero { padding:30px 26px 30px; text-align:center; margin-bottom:16px; overflow:hidden; }
  .emblem { display:flex; justify-content:center; margin-bottom:8px; }
  .emblem:empty { display:none; }
  .emblem svg, .pin-emblem svg { filter:drop-shadow(0 4px 10px rgba(0,0,0,.28)); }
  .emblem svg { animation:bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-5px) rotate(3deg)} }
  .hero .who { font-size:15px; font-weight:500; color:var(--ink-soft); margin-bottom:10px; letter-spacing:.3px; }
  .hero .who b { font-weight:700; }
  .hero .amount { font-family:var(--num); font-size:82px; font-weight:600; letter-spacing:0; line-height:.9; font-variant-numeric:tabular-nums lining-nums; }
  .hero .amount .cur { font-family:var(--num); font-size:30px; font-weight:600; vertical-align:36px; margin-right:6px; color:var(--ink-soft); }
  .hero.settled .amount { color:#7FBE86; }
  .hero .sub { margin-top:16px; font-size:13px; color:var(--ink-soft); font-weight:400; }
  .who-owe-u b { color:var(--u-color); }
  .who-owe-t b { color:var(--t-color); }

  .stats { display:flex; gap:12px; margin-bottom:24px; }
  .stat { flex:1; padding:17px 14px; text-align:center; }
  .stat .av { width:38px; height:38px; border-radius:13px; margin:0 auto 9px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:15px; box-shadow:0 5px 14px rgba(0,0,0,.18); }
  .av.u { background:linear-gradient(135deg,var(--u-color),var(--u-color-2)); }
  .av.t { background:linear-gradient(135deg,var(--t-color),var(--t-color-2)); }
  .stat .lbl { font-size:12px; color:var(--ink-soft); font-weight:500; }
  .stat .val { font-family:var(--num); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums lining-nums; margin-top:3px; }

  .section-title { font-size:12px; font-weight:600; color:var(--ink-soft); letter-spacing:1px; margin:4px 8px 13px; display:flex; justify-content:space-between; }
  .section-title .hint { text-transform:none; letter-spacing:0; opacity:.75; }
  .feed { display:flex; flex-direction:column; gap:11px; }
  .empty { text-align:center; color:var(--ink-soft); font-size:13px; padding:26px 0; }
  .entry { display:flex; align-items:center; gap:13px; padding:14px 16px; border-radius:22px; cursor:pointer; }
  .entry .av { width:40px; height:40px; border-radius:14px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; box-shadow:0 5px 13px rgba(0,0,0,.18); }
  .entry .mid { flex:1; min-width:0; }
  .entry .note { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry .meta { font-size:12px; color:var(--ink-soft); margin-top:3px; display:flex; align-items:center; gap:7px; }
  .entry .tag { padding:2px 9px; border-radius:9px; font-size:10.5px; font-weight:600; background:var(--chip-bg); color:var(--ink-soft); }
  .entry .tag.full { color:var(--u-color); }
  .entry .amt { font-family:var(--num); font-weight:600; font-size:22px; font-variant-numeric:tabular-nums lining-nums; white-space:nowrap; }
  .entry.settle-line { justify-content:center; color:#7FBE86; font-weight:600; font-size:13px; background:rgba(127,190,134,.15); cursor:default; }

  .dock { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; padding:14px 18px calc(20px + env(safe-area-inset-bottom)); pointer-events:none; }
  .dock-inner { display:flex; align-items:center; gap:12px; width:100%; max-width:424px; pointer-events:auto; }
  .fab { flex:1; height:60px; border:none; border-radius:22px; font-size:17px; font-weight:600; color:#fff; letter-spacing:1px;
    background:var(--grad); box-shadow:0 12px 30px rgba(0,0,0,.32), inset 0 1px 1px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; transition:transform .18s cubic-bezier(.2,.9,.3,1.4); }
  .fab:active { transform:scale(.94); }
  .fab .plus { font-size:23px; font-weight:300; }
  .btn-settle { width:60px; height:60px; border:none; border-radius:22px; cursor:pointer; font-size:22px; color:var(--ink);
    background:var(--glass-strong); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid var(--hair); box-shadow:var(--shadow); transition:transform .18s cubic-bezier(.2,.9,.3,1.4); }
  .btn-settle:active { transform:scale(.9); }

  .scrim { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,0); backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0);
    transition:background .35s, backdrop-filter .35s; pointer-events:none; }
  .scrim.open { background:rgba(0,0,0,.4); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:31; max-width:460px; margin:0 auto;
    border-radius:34px 34px 0 0; padding:12px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .5s cubic-bezier(.16,1,.3,1); max-height:92vh; overflow-y:auto; }
  .sheet.open { transform:translateY(0); }
  .grip { width:42px; height:5px; border-radius:3px; background:var(--hair); margin:6px auto 16px; }
  .sheet h3 { font-size:17px; font-weight:600; text-align:center; margin-bottom:20px; color:var(--ink); }

  .amt-input { text-align:center; margin-bottom:22px; }
  .amt-input .cur { font-family:var(--num); font-size:26px; font-weight:600; color:var(--ink-soft); vertical-align:20px; margin-right:3px; }
  .amt-input input { font-family:var(--num); border:none; background:transparent; font-size:66px; font-weight:600; color:var(--ink);
    width:auto; max-width:230px; text-align:center; outline:none; font-variant-numeric:tabular-nums lining-nums; letter-spacing:0; }
  .amt-input input::placeholder { color:var(--ink-soft); opacity:.4; }

  .field-lbl { font-size:12px; font-weight:600; color:var(--ink-soft); letter-spacing:.5px; margin:0 4px 9px; }
  .seg { display:flex; gap:8px; margin-bottom:18px; }
  .seg button { flex:1; padding:14px 8px; border:none; border-radius:18px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;
    background:var(--field-bg); color:var(--ink-soft); border:1.5px solid transparent; transition:all .22s cubic-bezier(.2,.9,.3,1.2);
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .seg button .mini { width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }
  .seg button.on { background:var(--glass-strong); color:var(--ink); box-shadow:0 6px 16px rgba(0,0,0,.18); transform:translateY(-1px); }
  .seg.payer button.on[data-p="u"] { border-color:var(--u-color); }
  .seg.payer button.on[data-p="t"] { border-color:var(--t-color); }
  .seg.split button.on { border-color:var(--ink-soft); }
  .split-hint { font-size:12px; color:var(--ink-soft); margin:-8px 6px 18px; }

  .note-input, .date-input { width:100%; border:none; background:var(--field-bg); border-radius:18px; padding:15px 16px; font-family:inherit; font-size:15px; color:var(--ink); outline:none; margin-bottom:18px; }
  .note-input::placeholder { color:var(--ink-soft); opacity:.6; }
  .date-input { color-scheme:dark; }
  .save { width:100%; height:56px; border:none; border-radius:20px; font-family:inherit; font-size:16px; font-weight:600; color:#fff; cursor:pointer;
    background:var(--grad); box-shadow:0 10px 26px rgba(0,0,0,.3); transition:transform .16s; margin-top:2px; }
  .save:active { transform:scale(.97); }
  .save[disabled] { opacity:.42; box-shadow:none; }

  .toast { position:fixed; left:50%; bottom:96px; transform:transl(-50%,20px); translate:-50% 0; z-index:60; padding:12px 20px; border-radius:16px;
    background:rgba(20,18,22,.9); color:#fff; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:80%; text-align:center; }
  .toast.show { opacity:1; }

  .rise { opacity:0; transform:translateY(22px); animation:rise .7s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .pop { animation:pop .55s cubic-bezier(.16,1.3,.4,1); }
  @keyframes pop { 0%{opacity:0; transform:scale(.8) translateY(10px)} 100%{opacity:1; transform:none} }

  @media (prefers-reduced-motion: reduce) {
    .blob,#fx .sp,.emblem svg,.pin-emblem svg { animation:none !important; }
    #fx .sp { opacity:.6 !important; }
    .rise,.pop { animation:none !important; opacity:1 !important; transform:none !important; }
    .fab,.btn-settle,.sheet,.scrim,.save,.seg button { transition:none !important; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<div id="vig"></div>
<div id="fx"></div>

<!-- PIN 鎖 -->
<div class="pin-gate" id="pinGate">
  <div class="pin-card glass">
    <div class="pin-emblem" id="pinEmblem"></div>
    <h2>共用記帳小本本</h2>
    <p id="pinMsg">輸入通關密碼</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="pin-pad" id="pinPad"></div>
  </div>
</div>

<div class="app">
  <div class="topbar rise" style="animation-delay:.02s">
    <div class="brand"><span class="dot"></span>共用記帳小本本</div>
    <div class="datepill glass"><span class="sync" id="syncDot"></span><span id="today">—</span></div>
  </div>

  <div class="rise" style="animation-delay:.05s">
    <div class="viewer" id="viewer">
      <span class="vlab">誰在看</span>
      <button class="vbtn" data-who="宇群" type="button">宇群</button>
      <button class="vbtn" data-who="廷璇" type="button">廷璇</button>
    </div>
    <div class="palettes" id="palettes"></div>
    <div class="theme-cap" id="themeCap"></div>
  </div>

  <div class="hero glass rise" id="hero" style="animation-delay:.1s">
    <div class="emblem" id="emblem"></div>
    <div class="who" id="heroWho">載入中…</div>
    <div class="amount"><span class="cur">NT$</span><span id="heroAmt">0</span></div>
    <div class="sub" id="heroSub"></div>
  </div>

  <div class="stats">
    <div class="stat glass rise" style="animation-delay:.18s">
      <div class="av u">宇</div><div class="lbl">宇群 本期付出</div><div class="val" id="uPaid">—</div>
    </div>
    <div class="stat glass rise" style="animation-delay:.24s">
      <div class="av t">廷</div><div class="lbl">廷璇 本期付出</div><div class="val" id="tPaid">—</div>
    </div>
  </div>

  <div class="section-title rise" style="animation-delay:.3s"><span>明細 · RECENT</span><span class="hint">點一筆可刪除</span></div>
  <div class="feed" id="feed"></div>
</div>

<div class="dock">
  <div class="dock-inner">
    <button class="fab" id="openBtn"><span class="plus">＋</span>記一筆</button>
    <button class="btn-settle" id="settleBtn" title="結清">🤝</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet">
  <div class="grip"></div>
  <h3>記一筆</h3>
  <div class="amt-input"><span class="cur">NT$</span><input id="amt" type="tel" inputmode="numeric" placeholder="0" maxlength="7"></div>

  <div class="field-lbl">誰付的？</div>
  <div class="seg payer" id="payerSeg">
    <button data-p="u" class="on" type="button"><span class="mini" style="background:linear-gradient(135deg,var(--u-color),var(--u-color-2))">宇</span>宇群付</button>
    <button data-p="t" type="button"><span class="mini" style="background:linear-gradient(135deg,var(--t-color),var(--t-color-2))">廷</span>廷璇付</button>
  </div>

  <div class="field-lbl">怎麼分？</div>
  <div class="seg split" id="splitSeg">
    <button data-s="split" class="on" type="button">🤝 兩人平分</button>
    <button data-s="full" type="button">🎁 全額幫墊</button>
  </div>
  <div class="split-hint" id="splitHint">各付一半，付錢的人先墊另一半</div>

  <div class="field-lbl">買了什麼？</div>
  <input class="note-input" id="note" type="text" placeholder="例如 拉麵、電影票（可留空）" maxlength="24">

  <div class="field-lbl">日期</div>
  <input class="date-input" id="date" type="date">

  <button class="save" id="saveBtn" type="button" disabled>加進小本本</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= 設定 ================= */
var SUPABASE_URL = "https://wanpsjdnvkqaddzqyqyc.supabase.co";
var SUPABASE_KEY = "sb_publishable_AU9HPghbL2BlLRsxzzPskA_IadwWMWl";
var APP_PIN = "1207";
var U = "宇群", T = "廷璇";

var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var sb = null;
var state = { entries: [], justSettled:false };

function $(id){ return document.getElementById(id); }
function toISO(d){ var z=function(n){return String(n).padStart(2,"0");}; return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function todayISO(){ return toISO(new Date()); }
function fmt(n){ return Math.round(Number(n)).toLocaleString("en-US"); }
function fmtDate(s){ if(!s) return ""; var p=String(s).split("-"); return p.length>=3 ? (parseInt(p[1],10)+"/"+parseInt(p[2],10)) : s; }

var toastTimer=null;
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },2600); }

/* ================= PIN ================= */
(function(){
  var buf="", gate=$("pinGate"), dots=$("pinDots").children, pad=$("pinPad");
  var keys=["1","2","3","4","5","6","7","8","9","blank","0","del"];
  keys.forEach(function(k){
    var b=document.createElement("button"); b.type="button";
    if(k==="blank"){ b.className="pin-key blank"; }
    else if(k==="del"){ b.className="pin-key fn"; b.textContent="⌫"; b.onclick=function(){ buf=buf.slice(0,-1); paint(); }; }
    else { b.className="pin-key"; b.textContent=k; b.onclick=function(){ if(buf.length<4){ buf+=k; paint(); check(); } }; }
    pad.appendChild(b);
  });
  function paint(){ for(var i=0;i<4;i++) dots[i].classList.toggle("on", i<buf.length); }
  function check(){
    if(buf.length<4) return;
    if(buf===APP_PIN){
      try{ localStorage.setItem("ledgerAuthed","1"); }catch(e){}
      gate.classList.add("hide"); setTimeout(function(){ gate.style.display="none"; },500);
      startApp();
    } else {
      gate.classList.add("err"); $("pinMsg").textContent="密碼不對，再試一次";
      setTimeout(function(){ gate.classList.remove("err"); buf=""; paint(); },450);
    }
  }
  // 這台裝置若已通過就直接進
  var ok=false; try{ ok=localStorage.getItem("ledgerAuthed")==="1"; }catch(e){}
  if(ok){ gate.classList.add("hide"); gate.style.display="none"; startApp(); }
})();

/* ================= 主程式（PIN 過關後） ================= */
function startApp(){
  if(sb) return; // 只啟動一次
  $("today").textContent = (new Date().getMonth()+1)+"月"+new Date().getDate()+"日";
  $("date").value = todayISO();

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  load();

  // 即時同步：任一方新增/刪除/結清，另一方自動更新
  sb.channel("ledger-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"ledger_entries" }, function(){ load(); })
    .subscribe(function(status){ $("syncDot").classList.toggle("ok", status==="SUBSCRIBED"); });

  wireSheet();
}

function net(){ return state.entries.reduce(function(s,e){ var a=Number(e.amount); var v=e.split_type==="full"?a:a/2; return s+(e.payer===U?v:-v); },0); }
function paidBy(who){ return state.entries.filter(function(e){return e.payer===who;}).reduce(function(s,e){return s+Number(e.amount);},0); }

var shownAmt=0;
function animateNumber(to){
  var el=$("heroAmt");
  if(reduce){ el.textContent=fmt(to); shownAmt=to; return; }
  var from=shownAmt, start=null, dur=700;
  function step(ts){ if(!start)start=ts; var p=Math.min((ts-start)/dur,1); var e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e); if(p<1)requestAnimationFrame(step); else shownAmt=to; }
  requestAnimationFrame(step);
}
function renderHero(){
  var ts=window.TSUB||{owe:"記得早點還喔 💸",even:"互不相欠，繼續加油"};
  var hero=$("hero"), heroWho=$("heroWho");
  var n=net(); hero.classList.remove("settled"); heroWho.className="who";
  if(Math.abs(n)<0.5){ heroWho.innerHTML="目前打平了 🎉"; $("heroSub").textContent=ts.even; hero.classList.add("settled"); animateNumber(0); return; }
  if(n>0){ heroWho.innerHTML="<b>廷璇</b> 欠 <b>宇群</b>"; heroWho.classList.add("who-owe-u"); $("heroSub").textContent=ts.owe; }
  else   { heroWho.innerHTML="<b>宇群</b> 欠 <b>廷璇</b>"; heroWho.classList.add("who-owe-t"); $("heroSub").textContent=ts.owe; }
  animateNumber(Math.abs(n));
}
window.refreshHero = renderHero;

function entryRow(e,isNew){
  var isU=e.payer===U;
  var el=document.createElement("div"); el.className="entry glass"+(isNew?" pop":"");
  el.innerHTML='<div class="av '+(isU?'u':'t')+'">'+(isU?'宇':'廷')+'</div>'+
    '<div class="mid"><div class="note">'+escapeHtml(e.note||"一筆消費")+'</div><div class="meta">'+e.payer+'付 · '+fmtDate(e.entry_date)+
    '<span class="tag'+(e.split_type==="full"?' full':'')+'">'+(e.split_type==="full"?"🎁 幫墊":"🤝 平分")+'</span></div></div>'+
    '<div class="amt">$'+fmt(e.amount)+'</div>';
  el.onclick=function(){ delEntry(e); };
  return el;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function renderFeed(){
  var feed=$("feed"); feed.innerHTML="";
  if(state.entries.length===0){
    var msg=state.justSettled ? '<div class="entry settle-line glass pop">✅ 已結清，兩人歸零</div>'
                              : '<div class="empty">還沒有任何記錄，按下方「＋ 記一筆」開始吧</div>';
    feed.innerHTML=msg; return;
  }
  state.entries.forEach(function(e,i){ var r=entryRow(e,false);
    if(!reduce){ r.classList.add("rise"); r.style.animationDelay=(0.02+i*0.05)+"s"; } feed.appendChild(r); });
}
function refreshStats(){ $("uPaid").textContent="$"+fmt(paidBy(U)); $("tPaid").textContent="$"+fmt(paidBy(T)); }
function renderAll(){ renderHero(); renderFeed(); refreshStats(); }

/* ================= 資料操作 ================= */
async function load(){
  try{
    var res=await sb.from("ledger_entries").select("*").is("cleared_at",null)
      .order("entry_date",{ascending:false}).order("created_at",{ascending:false});
    if(res.error){ toast("讀取失敗："+res.error.message); return; }
    state.entries=res.data||[]; renderAll();
  }catch(err){ toast("連線失敗，請檢查網路"); }
}
async function addEntry(payer, amount, split_type, note, entry_date){
  var res=await sb.from("ledger_entries").insert({ payer:payer, amount:amount, split_type:split_type, note:note, entry_date:entry_date });
  if(res.error){ toast("儲存失敗："+res.error.message); return false; }
  state.justSettled=false; await load(); return true;
}
async function delEntry(e){
  if(!confirm("刪除這筆「"+(e.note||"一筆消費")+" $"+fmt(e.amount)+"」？")) return;
  var res=await sb.from("ledger_entries").delete().eq("id",e.id);
  if(res.error){ toast("刪除失敗："+res.error.message); return; }
  await load();
}
async function settle(){
  if(state.entries.length===0){ toast("目前沒有需要結清的帳"); return; }
  if(!confirm("要把目前的帳全部結清、歸零嗎？結清後會從明細移除（保留在雲端記錄）。")) return;
  var res=await sb.from("ledger_entries").update({ cleared_at:new Date().toISOString() }).is("cleared_at",null);
  if(res.error){ toast("結清失敗："+res.error.message); return; }
  shownAmt=0; state.justSettled=true; await load();
}

/* ================= 記帳表單 ================= */
function wireSheet(){
  var scrim=$("scrim"), sheet=$("sheet"), amt=$("amt"), note=$("note"), dateEl=$("date"), saveBtn=$("saveBtn");
  var curPayer="u", curSplit="split";
  function openSheet(){ dateEl.value=todayISO(); scrim.classList.add("open"); sheet.classList.add("open"); setTimeout(function(){amt.focus();},350); }
  function closeSheet(){ scrim.classList.remove("open"); sheet.classList.remove("open"); }
  function validate(){ saveBtn.disabled=!(parseInt(amt.value,10)>0); }
  $("openBtn").onclick=openSheet; scrim.onclick=closeSheet;
  amt.addEventListener("input",function(){ amt.value=amt.value.replace(/[^0-9]/g,""); validate(); });
  $("payerSeg").addEventListener("click",function(ev){ var b=ev.target.closest("button"); if(!b)return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); curPayer=b.dataset.p; });
  var splitHint=$("splitHint");
  $("splitSeg").addEventListener("click",function(ev){ var b=ev.target.closest("button"); if(!b)return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); curSplit=b.dataset.s;
    splitHint.textContent = curSplit==="full" ? "整筆算對方的，付錢的人幫忙代墊" : "各付一半，付錢的人先墊另一半"; });
  saveBtn.onclick=async function(){
    var v=parseInt(amt.value,10); if(!(v>0)) return;
    saveBtn.disabled=true; saveBtn.textContent="儲存中…";
    var ok=await addEntry(curPayer==="u"?U:T, v, curSplit, note.value.trim()||"一筆消費", dateEl.value||todayISO());
    saveBtn.textContent="加進小本本";
    if(ok){ closeSheet(); amt.value=""; note.value=""; validate(); }
    else { saveBtn.disabled=false; }
  };
  $("settleBtn").onclick=settle;
}
